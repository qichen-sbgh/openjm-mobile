name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # runner 自带 Android SDK；setup-android 会去装已下架的 'tools' 包，反而失败
      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true

      # openjm 总仓已公开，冻结向量可以匿名拉；之前这几个回放用例在 CI 里一直是 skip 的
      - name: Checkout test vectors
        uses: actions/checkout@v4
        with:
          repository: qichen-sbgh/openjm
          path: openjm

      # 只构建 Android；iOS 冻结在 M4 之前不参与 CI（见 openjm decisions D10）
      - name: Build and test
        env:
          OPENJM_TESTVECTORS: ${{ github.workspace }}/openjm/testvectors
        run: ./gradlew :androidApp:assembleDebug :shared:testAndroidHostTest --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: openjm-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
